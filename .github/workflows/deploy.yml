name: Deploy Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 1. TEST PHASE: Lint, Typecheck, Unit Tests, and Pact Contract Tests
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Static Analysis (Lint & Typecheck)
        run: |
          npm run lint:frontend
          npm run typecheck:frontend
          npm run lint:backend
          npm run typecheck:backend

      - name: Consumer Contract Tests (Frontend)
        run: npm run test:frontend
      
      - name: Provider Contract Tests (Backend)
        run: npm run test:backend

  # 2. BUILD PHASE: Build and Push Docker Images to GHCR
  docker-build-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Repository Name
        run: echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}-backend:${{ github.sha }}
            ghcr.io/${{ env.REPO_LOWER }}-backend:latest
          cache-from: type=registry,ref=ghcr.io/${{ env.REPO_LOWER }}-backend:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.REPO_LOWER }}-backend:buildcache,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: true
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}-frontend:${{ github.sha }}
            ghcr.io/${{ env.REPO_LOWER }}-frontend:latest
          cache-from: type=registry,ref=ghcr.io/${{ env.REPO_LOWER }}-frontend:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.REPO_LOWER }}-frontend:buildcache,mode=max

  # 3. VERIFY PHASE: Full-Stack E2E and Security Scans
  e2e-and-security:
    needs: docker-build-push
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.44.0-jammy
      options: --user root -v /var/run/docker.sock:/var/run/docker.sock
    steps:
      - uses: actions/checkout@v5

      - name: Prepare Repository Name
        run: echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Spin up full stack for testing
        env:
          FRONTEND_IMAGE: ghcr.io/${{ env.REPO_LOWER }}-frontend:${{ github.sha }}
          BACKEND_IMAGE: ghcr.io/${{ env.REPO_LOWER }}-backend:${{ github.sha }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ALLOW_MOCK_AUTH: "true"
        run: |
          docker compose up -d
          # Wait for frontend to be reachable
          npx wait-on http://localhost:5173 --timeout 60000

      - name: Run Playwright E2E Tests
        env:
          BASE_URL: http://localhost:5173
        run: npm --workspace frontend run test:e2e

      - name: OWASP ZAP Security Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:5173'
          fail_action: false

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: playwright-report
          path: apps/frontend/playwright-report/

  # 4. DEPLOY PHASE: Infrastructure and Deployment
  deploy:
    needs: e2e-and-security
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init & Apply
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
        run: |
          cd infra/terraform
          terraform init
          terraform apply -auto-approve