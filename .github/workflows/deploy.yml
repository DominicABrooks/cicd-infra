name: Deploy

on:
  push:
    branches: [main]

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - run: cd infra/terraform && terraform init
      - run: cd infra/terraform && terraform apply -auto-approve

  build:
    runs-on: ubuntu-latest
    needs: terraform

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '18'

      - run: npm ci

      # Static checks
      - run: npm run lint:frontend
      - run: npm run typecheck:frontend
      - run: npm run lint:backend
      - run: npm run typecheck:backend

      # Unit tests & Contract tests
      - name: Run frontend tests (generates Pact consumer contracts)
        run: npm run test:frontend
      - name: Run backend tests (verifies Pact provider contracts)
        run: npm run test:backend

      # Build artifacts
      - run: npm run build:frontend
      - run: npm run build:backend

      # Upload frontend build for next job
      - uses: actions/upload-artifact@v5
        with:
          name: frontend-dist
          path: apps/frontend/dist

  e2e:
    runs-on: ubuntu-latest
    needs: build

    container:
      image: mcr.microsoft.com/playwright:v1.59.1-jammy

    # Fix for Firefox
    env:
      HOME: /root

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '18'

      - run: npm ci

      # Download built frontend
      - uses: actions/download-artifact@v5
        with:
          name: frontend-dist
          path: apps/frontend/dist

      # Serve built app
      - name: Start frontend server
        run: |
          npx serve apps/frontend/dist -l 5173 &
          npx wait-on http://localhost:5173

      # Run Playwright tests (no install needed in this container)
      - run: npx playwright test --config=apps/frontend/playwright.config.ts

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: playwright-report
          path: apps/frontend/playwright-report/

  security:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '18'

      - uses: actions/download-artifact@v5
        with:
          name: frontend-dist
          path: apps/frontend/dist

      - name: Start frontend server
        run: |
          npx serve apps/frontend/dist -l 5173 &
          npx wait-on http://localhost:5173

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          # 172.17.0.1 is the default Docker bridge IP which allows the ZAP container to reach the runner's localhost
          target: 'http://172.17.0.1:5173'

  deploy:
    runs-on: ubuntu-latest
    needs: [e2e, security]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: frontend-dist
          path: apps/frontend/dist

      - name: Deploy to Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/frontend/dist