name: Deploy Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 1. TEST PHASE: Lint, Typecheck, Unit Tests, and Pact Contract Tests
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Run Tests & Static Analysis
        run: npx turbo run lint typecheck test

  # 2. BUILD PHASE: Build and Push Docker Images to GHCR
  docker-build-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Repository Name
        run: echo "REPO_LOWER=$(echo ${GITHUB_REPOSITORY} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prune Backend Workspace
        run: npx turbo prune backend --docker

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./out
          file: ./out/apps/backend/Dockerfile
          push: ${{ !env.ACT }}
          load: ${{ !!env.ACT }}
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}-backend:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ env.REPO_LOWER }}-backend:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.REPO_LOWER }}-backend:buildcache,mode=max

      - name: Prune Frontend Workspace
        run: npx turbo prune frontend --docker

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./out
          file: ./out/apps/frontend/Dockerfile
          push: ${{ !env.ACT }}
          load: ${{ !!env.ACT }}
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}-frontend:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ env.REPO_LOWER }}-frontend:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.REPO_LOWER }}-frontend:buildcache,mode=max

  # 3. VERIFY PHASE: Full-Stack E2E and Security Scans
  e2e-and-security:
    needs: [test, docker-build-push]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3]
        shardTotal: [3]
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5

      - name: Prepare Repository Name
        run: echo "REPO_LOWER=$(echo ${GITHUB_REPOSITORY} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Spin up full stack and start E2E
        env:
          FRONTEND_IMAGE: ghcr.io/${{ env.REPO_LOWER }}-frontend:${{ github.sha }}
          BACKEND_IMAGE: ghcr.io/${{ env.REPO_LOWER }}-backend:${{ github.sha }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ALLOW_MOCK_AUTH: "true"
          SHARD_ARG: "--shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}"
        run: |
          docker compose up -d db backend frontend
          
          # Start the Playwright service in detached mode to run concurrently with ZAP
          docker compose up -d playwright

      - name: OWASP ZAP Security Scan
        if: matrix.shardIndex == 1
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:5173'
          fail_action: false
          artifact_name: 'zap-scan-report'
          allow_issue_writing: ${{ !env.ACT }}

      - name: Wait for E2E tests to complete
        env:
          FRONTEND_IMAGE: ghcr.io/${{ env.REPO_LOWER }}-frontend:${{ github.sha }}
          BACKEND_IMAGE: ghcr.io/${{ env.REPO_LOWER }}-backend:${{ github.sha }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ALLOW_MOCK_AUTH: "true"
        run: |
          # Retrieve the playwright container ID
          PLAYWRIGHT_CONTAINER=$(docker compose ps -q -a playwright)
          
          # Block until it finishes and get the exit code
          EXIT_CODE=$(docker wait $PLAYWRIGHT_CONTAINER)
          echo "Playwright exited with code: $EXIT_CODE"
          
          # Print the Playwright logs for the GitHub Actions console
          docker compose logs playwright
          
          if [ "$EXIT_CODE" != "0" ]; then
            exit $EXIT_CODE
          fi

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: playwright-report-shard-${{ matrix.shardIndex }}
          path: playwright-report/

  # 4. PROMOTE PHASE: Tag successful images as latest
  promote-images:
    needs: e2e-and-security
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Prepare Repository Name
        run: echo "REPO_LOWER=$(echo ${GITHUB_REPOSITORY} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Promote Backend to latest
        run: |
          docker buildx imagetools create \
            ghcr.io/${{ env.REPO_LOWER }}-backend:${{ github.sha }} \
            --tag ghcr.io/${{ env.REPO_LOWER }}-backend:latest

      - name: Promote Frontend to latest
        run: |
          docker buildx imagetools create \
            ghcr.io/${{ env.REPO_LOWER }}-frontend:${{ github.sha }} \
            --tag ghcr.io/${{ env.REPO_LOWER }}-frontend:latest

  # 5. DEPLOY PHASE: Infrastructure and Deployment
  deploy:
    needs: promote-images
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init & Apply
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
        run: |
          cd infra/terraform
          terraform init
          terraform apply -auto-approve